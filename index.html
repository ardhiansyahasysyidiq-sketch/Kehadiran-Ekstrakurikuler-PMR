<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kehadiran Ekstrakurikuler PMR</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 15px; }
    .card { background: white; padding: 25px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); width: 100%; max-width: 420px; text-align: center; }
    h2 { color: #333; margin-bottom: 20px; font-size: 22px; }
    .input-group { text-align: left; margin-bottom: 15px; }
    label { font-size: 14px; font-weight: 600; color: #555; display: block; margin-bottom: 6px; }
    input[type="text"] { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; outline: none; }
    input[type="text"]:disabled { background-color: #e9ecef; cursor: not-allowed; }
    
    #username { text-transform: uppercase; }

    .camera-box { width: 100%; height: 240px; background: #222; border-radius: 12px; overflow: hidden; position: relative; margin-bottom: 15px; display: flex; justify-content: center; align-items: center; }
    
    video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    canvas { width: 100%; height: 100%; object-fit: cover; }
    
    button { width: 100%; background: #4F46E5; color: white; border: none; padding: 14px; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    button:active { background: #4338CA; }
    button:disabled { background: #9CA3AF !important; cursor: not-allowed !important; opacity: 0.8; }
    
    .btn-secondary { background: #6B7280; margin-bottom: 10px; padding: 8px; font-size: 13px; }

    #status { margin-top: 15px; font-size: 14px; color: #666; font-weight: 500; line-height: 1.4; }
    .error { color: #DC2626 !important; }
    .success { color: #16A34A !important; }
  </style>
</head>
<body>

<div class="card">
  <h2>Kehadiran Ekstrakurikuler PMR</h2>
  
  <div class="input-group">
    <label for="username">Nama</label>
    <input type="text" id="username" placeholder="Nama (Kapital semua yaw)">
  </div>

  <div class="input-group">
    <label for="userclass">Kelas</label>
    <input type="text" id="userclass" placeholder="Kelas (Contoh = X-1)">
  </div>

  <div class="camera-box">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas" style="display:none;"></canvas>
  </div>

  <button id="btnRetryCam" class="btn-secondary" style="display:none;" onclick="startCamera()">Aktifkan Kamera Ulang</button>
  <button id="btnAbsen" onclick="prosesAbsensi()">KIRIM ABSENSI</button>
  <div id="status">Sabar yaa, lagi loadingg 🦇</div>
</div>

<script>
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzHaqldRMQHCY8iThFxkaAmKup_BQdBkc4T_18AsTFFWBpURkFJCrJ6n2Q1oK0QHKfj/exec';

  const TARGET_LAT = -7.420934568290806;
  const TARGET_LONG = 109.23722062789159;
  const MAX_RADIUS = 500.0; 

  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  const status = document.getElementById('status');
  const btn = document.getElementById('btnAbsen');
  const btnRetryCam = document.getElementById('btnRetryCam');
  const inputNama = document.getElementById('username');
  const inputKelas = document.getElementById('userclass');

  // Cek Status Kunci Absen Mingguan (localStorage)
  function checkWeeklyLock() {
    const lastAbsenTime = localStorage.getItem('pmr_last_absen_timestamp');
    if (lastAbsenTime) {
      const now = new Date().getTime();
      const selisihWaktu = now - parseInt(lastAbsenTime);
      const tujuhHariMs = 7 * 24 * 60 * 60 * 1000; // 7 hari

      if (selisihWaktu < tujuhHariMs) {
        btn.disabled = true;
        inputNama.disabled = true;
        inputKelas.disabled = true;
        
        if (localStorage.getItem('pmr_user_nama')) inputNama.value = localStorage.getItem('pmr_user_nama');
        if (localStorage.getItem('pmr_user_kelas')) inputKelas.value = localStorage.getItem('pmr_user_kelas');

        updateStatus('Kamu sudah absen minggu ini yaw! Sampai jumpa minggu depan 👋', false, true);
        return true;
      }
    }
    return false;
  }

  function startCamera() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      updateStatus('Browser kamu tidak mendukung akses kamera langsung.', true);
      return;
    }

    navigator.mediaDevices.getUserMedia({ 
      video: { 
        facingMode: "user",
        width: { ideal: 640 },
        height: { ideal: 480 }
      }, 
      audio: false 
    })
    .then(stream => { 
      video.srcObject = stream; 
      video.play();
      btnRetryCam.style.display = 'none';
      if (!checkWeeklyLock()) {
        status.innerText = 'Kamera & lokasi siap.'; 
      }
    })
    .catch(err => { 
      if (!checkWeeklyLock()) {
        updateStatus('Kamera belum aktif/diizinkan. Klik "Aktifkan Kamera Ulang" di atas!', true); 
        btnRetryCam.style.display = 'block';
      }
    });
  }

  if (!checkWeeklyLock()) {
    startCamera();
  }

  function getDistanceInMeters(lat1, lon1, lat2, lon2) {
    const R = 6371000;
    const rad = Math.PI / 180;
    const dLat = (lat2 - lat1) * rad;
    const dLon = (lon2 - lon1) * rad;
    
    const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
              Math.cos(lat1 * rad) * Math.cos(lat2 * rad) *
              Math.sin(dLon / 2) * Math.sin(dLon / 2);
              
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    return R * c;
  }

  function updateStatus(msg, isError = false, isSuccess = false) {
    status.innerText = msg;
    status.className = isError ? 'error' : (isSuccess ? 'success' : '');
  }

  async function prosesAbsensi() {
    if (checkWeeklyLock()) return;

    const username = inputNama.value.trim().toUpperCase();
    const userclass = inputKelas.value.trim();

    if (!username) { alert('Isi Nama dulu!'); return; }
    if (!userclass) { alert('Isi Kelas dulu!'); return; }

    if (!video.srcObject || video.readyState !== 4) {
      alert('Kamera belum siap/masih hitam! Silakan klik Aktifkan Kamera Ulang.');
      startCamera();
      return;
    }

    btn.disabled = true;
    updateStatus('Sabar yaa, lagi loadingg 🦇');

    if (!navigator.geolocation) {
      updateStatus('Browser kamu tidak mendukung Geolocation.', true);
      btn.disabled = false;
      return;
    }

    const geoOptions = {
      enableHighAccuracy: true,
      timeout: 10000,
      maximumAge: 0
    };

    navigator.geolocation.getCurrentPosition(async (pos) => {
      const lat = pos.coords.latitude;
      const lng = pos.coords.longitude;

      const distance = getDistanceInMeters(lat, lng, TARGET_LAT, TARGET_LONG);

      // Pengecekan Radius (Pesan Eror Tanpa Angka Jarak)
      if (distance > MAX_RADIUS) {
        updateStatus(`Posisi kamu di luar SMA N 1 Purwokerto.`, true);
        btn.disabled = false;
        return;
      }

      updateStatus('Sabar yaa, lagi loadingg 🦇');
      
      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;
      const ctx = canvas.getContext('2d');
      
      ctx.translate(canvas.width, 0);
      ctx.scale(-1, 1);
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      const base64Image = canvas.toDataURL('image/png').replace(/^data:image\/png;base64,/, "");

      updateStatus('Sabar yaa, lagi loadingg 🦇');

      const namaDanKelas = `${username} (${userclass})`;

      try {
        await fetch(SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            userId: namaDanKelas,
            latitude: lat,
            longitude: lng,
            gpsStatus: 'VALID (SMAN 1 Purwokerto)',
            imageBase64: base64Image
          })
        });

        // Simpan status ke browser HP
        const currentTimestamp = new Date().getTime();
        localStorage.setItem('pmr_last_absen_timestamp', currentTimestamp);
        localStorage.setItem('pmr_user_nama', username);
        localStorage.setItem('pmr_user_kelas', userclass);

        inputNama.disabled = true;
        inputKelas.disabled = true;
        btn.disabled = true;

        updateStatus('Hore, berhasil absen!!\nMakasih ya, dah ikut ekskul hari ini. Pissss ✌\n\n(Kamu sudah absen minggu ini yaw! Sampai jumpa minggu depan 👋)', false, true);

      } catch (err) {
        updateStatus('Gagal mengirim data: ' + err.message, true);
        btn.disabled = false;
      }

    }, (err) => {
      updateStatus('Gagal mendapatkan lokasi GPS: ' + err.message + '\nPastikan izin lokasi browser sudah diizinkan!', true);
      btn.disabled = false;
    }, geoOptions);
  }
</script>

</body>
</html>
